name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracer
          POSTGRES_PASSWORD: tracer
          POSTGRES_DB: agent_tracer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "server[dev]"
      - name: Lint
        run: ruff check server sdk
      - name: Tests (SQLite)
        working-directory: server
        run: pytest -q
      - name: Tests (PostgreSQL)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://tracer:tracer@localhost:5432/agent_tracer_test
        run: pytest -q
      - name: Migrations apply cleanly
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://tracer:tracer@localhost:5432/agent_tracer_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  sdk:
    name: SDK (tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e "sdk[dev]"
      - name: Tests
        working-directory: sdk
        run: pytest -q

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Tests
        working-directory: web
        run: npm run test
      - name: Build (includes type-check)
        working-directory: web
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build server -t agent-tracer-api:ci
      - name: Build web image
        run: docker build web -t agent-tracer-web:ci

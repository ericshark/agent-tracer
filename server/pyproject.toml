[project]
name = "agent-tracer-server"
version = "0.1.0"
description = "Agent Tracer API server — ingest, store, and explore AI agent execution traces"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyJWT>=2.8,<3",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
